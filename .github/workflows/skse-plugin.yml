name: SkylandsNative (SKSE plugin)

# Builds native/skse with MSVC and CommonLibSSE-NG and puts the DLL where the installer picks it up
# (setup/skylands_setup/bin/SkylandsNative.dll). Runs when the plugin source changes, or by hand.
on:
  push:
    paths:
      - "native/skse/**"
      - ".github/workflows/skse-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # alandtse/CommonLibSSE-NG, the maintained fork: v12.1.0 reads the Address Library of Skyrim 1.7.x (format 5) and treats
      # 1.7.x as the Anniversary Edition lineage; the CharmedBaryon version of 2024 did neither ("unsupported address library
      # format: 5"). On a clean release tag in CI its CMake downloads a prebuilt library instead of compiling it for ~16 minutes.
      - name: CommonLibSSE-NG
        shell: pwsh
        run: git clone --branch v12.1.0 --depth 1 --recurse-submodules --shallow-submodules https://github.com/alandtse/CommonLibSSE-NG ext/CommonLibSSE-NG

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Dependencies
        shell: pwsh
        run: vcpkg install spdlog fmt rapidcsv directxtk directxmath nlohmann-json simpleini toml11 xbyak --triplet x64-windows-static-md

      - name: Configure
        shell: pwsh
        run: >
          cmake -S native/skse -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCOMMONLIB_DIR="$PWD/ext/CommonLibSSE-NG"

      - name: Build
        shell: pwsh
        run: cmake --build build --target SkylandsNative

      - uses: actions/upload-artifact@v4
        with:
          name: SkylandsNative
          path: build/SkylandsNative.dll

      - name: Commit the DLL
        shell: pwsh
        run: |
          Copy-Item build/SkylandsNative.dll setup/skylands_setup/bin/SkylandsNative.dll -Force
          git config user.name "skylands-ci"
          git config user.email "skylands-ci@users.noreply.github.com"
          git add setup/skylands_setup/bin/SkylandsNative.dll
          if (git diff --cached --quiet) { Write-Host "DLL unchanged" } else {
            git commit -m "SkylandsNative.dll built by CI from ${{ github.sha }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          }
